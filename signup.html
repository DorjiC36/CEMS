<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCE Digital Notice Board - Sign Up</title>
    <link rel="icon" href="assets/logo.png" type="image/x-icon">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f7f8fc;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #4a5c9a;
            padding: 15px 30px;
            color: white;
        }

        .header-logo img {
            width: 60px;
            border-radius: 4px;
        }

        .signup-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
            padding: 20px;
        }

        .signup-form-card {
            background: #f1f3fa;
            padding: 40px;
            border-radius: 8px;
            width: 400px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .signup-form-card h2 {
            text-align: center;
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group input {
            width: 100%;
            padding: 10px;
            font-size: 1rem;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        .btn-signup-dark {
            width: 100%;
            padding: 12px;
            background: #4a5c9a;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
        }

        .btn-signup-dark:hover {
            background: #3a4c8a;
        }

        .login-link-text {
            text-align: center;
            margin-top: 15px;
        }

        .login-link-text a {
            color: #4a5c9a;
            font-weight: bold;
            text-decoration: none;
        }

        .login-link-text a:hover {
            text-decoration: underline;
        }

        .footer {
            text-align: center;
            padding: 20px;
            background: #4a5c9a;
            color: white;
        }

        .footer-links {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }

        .footer-links a {
            color: #dcdcdc;
            text-decoration: none;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <header class="header">
        <a href="index.html" style="color:white; text-decoration:none; font-size:1.5rem;">&larr;</a>
        <h1>Sign Up</h1>
        <div class="header-logo"><img src="assets/SCE-LOGO.jpg" alt="SCE Logo"></div>
    </header>

    <main class="signup-container">
        <div class="signup-form-card">
            <h2>Create Account</h2>
            <form id="signup-form">
                <div class="input-group">
                    <input type="text" id="full-name" placeholder="Full Name" required>
                </div>
                <div class="input-group">
                    <input type="email" id="email" placeholder="Email Address" required>
                </div>
                <div class="input-group">
                    <input type="password" id="password" placeholder="Password" required>
                </div>
                <div class="input-group">
                    <input type="password" id="confirm-password" placeholder="Confirm Password" required>
                </div>
                <button type="submit" class="btn-signup-dark">Sign Up</button>
            </form>
            <p class="login-link-text">Already have an account? <a href="index.html">Log in</a></p>
        </div>
    </main>

    <footer class="footer">
        <div class="footer-links">
            <a href="about.html">About us</a>
            <a href="privacy.html">Privacy Policy</a>
            <span>Academic • Sports & Games • Cultural</span>
        </div>
        <p>©2025 Samtse College of Education</p>
    </footer>

    <script>
        const signupForm = document.getElementById('signup-form');
        signupForm.addEventListener('submit', function (e) {
            e.preventDefault();
            const name = document.getElementById('full-name').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirm-password').value;

            if (password !== confirm) {
                alert("Passwords do not match!");
                return;
            }

            let users = JSON.parse(localStorage.getItem('sceUsers') || '[]');

            if (users.find(u => u.email === email)) {
                alert("Email already exists!");
                return;
            }

            users.push({ name, email, password, role: '' });
            localStorage.setItem('sceUsers', JSON.stringify(users));
            alert("Account created successfully! Please login.");
            window.location.href = "index.html";
        });
    </script>
</body>

</html>
