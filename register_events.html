<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register for Events - SCE</title>
  <link rel="icon" href="assets/logo.png" type="image/x-icon">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: #f5f7fa;
      margin: 0;
    }

    header {
      background: #5c75d4;
      color: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 15px 30px;
    }

    main {
      max-width: 800px;
      margin: 40px auto;
      background: white;
      border-radius: 10px;
      padding: 25px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    h2 {
      background: #5c75d4;
      color: white;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 20px;
    }

    .event-card {
      padding: 15px;
      border-bottom: 1px solid #eee;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
    }

    .event-card:last-child {
      border-bottom: none;
    }

    button {
      background: #5c75d4;
      color: white;
      padding: 8px 15px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .event-info h3 {
      margin: 0 0 5px 0;
      font-size: 1.1rem;
    }

    .event-info p {
      margin: 0;
      font-size: 0.95rem;
      color: #555;
    }
  </style>
</head>

<body>
  <header>
    <a href="main_menu.html">&larr;</a>
    <h1>Register for Events</h1>
    <img src="assets/SCE-LOGO.jpg" height="45">
  </header>

  <main>
    <h2>Make your presence known</h2>
    <div id="eventsList"></div>
  </main>

  <script>
    const STORAGE_KEY = 'collegeEvents';
    const listDiv = document.getElementById('eventsList');

    function assignIDs(events) { events.forEach((e, i) => { if (!e._id) e._id = Date.now() + i; }); return events; }
    function getEvents() { let events = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); events = assignIDs(events); localStorage.setItem(STORAGE_KEY, JSON.stringify(events)); return events; }

    function renderEvents() {
      const events = getEvents();
      listDiv.innerHTML = '';
      if (events.length === 0) { listDiv.innerHTML = '<p>No events added yet.</p>'; return; }
      events.sort((a, b) => new Date(a.date) - new Date(b.date));
      events.forEach(event => {
        const div = document.createElement('div');
        div.className = 'event-card';
        div.innerHTML = `
        <div class="event-info">
          <h3>${event.title} (${event.type})</h3>
          <p>📅 ${event.date} ${event.time ? 'at ' + event.time : ''} | 📍 ${event.venue}</p>
          <p>${event.description || ''}</p>
        </div>
        <button onclick="registerEvent(${event._id})">Register</button>
        `;
        listDiv.appendChild(div);
      });
    }

    window.registerEvent = function (id) { localStorage.setItem('selectedEventId', id); window.location.href = 'registration_form.html'; }

    renderEvents();
  </script>
</body>

</html>
