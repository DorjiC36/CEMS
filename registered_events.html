<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registered Events - SCE</title>
  <link rel="icon" href="assets/logo.png" type="image/x-icon">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background-color: #f5f7fa;
      margin: 0;
    }

    header {
      background-color: #5c75d4;
      color: white;
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header a {
      color: white;
      font-size: 1.8rem;
      font-weight: bold;
      text-decoration: none;
    }

    main {
      max-width: 900px;
      margin: 20px auto;
    }

    h2 {
      padding-left: 20px;
      color: #333;
    }

    .event-card {
      background: white;
      margin: 15px 20px;
      padding: 20px;
      border-radius: 10px;
      border-left: 5px solid #ffb907;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      position: relative;
    }

    .event-card h3 {
      margin-top: 0;
    }

    .event-card p {
      margin: 5px 0;
      color: #555;
    }

    .btn-cancel {
      position: absolute;
      right: 15px;
      top: 15px;
      background-color: #dc3545;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 5px;
      cursor: pointer;
    }

    .btn-cancel:hover {
      background-color: #b52b2b;
    }

    .no-events {
      text-align: center;
      margin-top: 50px;
      color: #777;
      font-size: 1.2rem;
    }
  </style>
</head>

<body>

  <header>
    <a href="main_menu.html">&larr;</a>
    <h1>Registered Events</h1>
    <img src="assets/SCE-LOGO.jpg" height="45">
  </header>

  <main>
    <h2>Your Confirmed Registrations</h2>
    <div id="registeredContainer"></div>
  </main>

  <script>
    const REG_KEY = 'registeredEvents';
    const container = document.getElementById("registeredContainer");

    function render() {
      const list = JSON.parse(localStorage.getItem(REG_KEY) || '[]');
      container.innerHTML = '';
      if (list.length === 0) { container.innerHTML = '<p class="no-events">You haven\'t registered for any events yet.</p>'; return; }

      list.forEach(r => {
        const div = document.createElement('div');
        div.className = 'event-card';
        const regDate = new Date(r.registrationDate).toLocaleString();
        div.innerHTML = `
        <h3>${r.eventTitle} (${r.eventType || 'N/A'})</h3>
        <p><strong>Date:</strong> ${r.eventDate}</p>
        <p><strong>Venue:</strong> ${r.eventVenue}</p>
        <p><strong>Student Name:</strong> ${r.name}</p>
        <p><strong>Student ID:</strong> ${r.id}</p>
        <p><strong>Course:</strong> ${r.course}</p>
        <p><strong>Registered On:</strong> ${regDate}</p>
        <button class="btn-cancel" onclick="cancelReg(${r.eventId}, '${r.id}')">Cancel</button>
        `;
        container.appendChild(div);
      });
    }

    window.cancelReg = function (eventId, studentId) {
      let list = JSON.parse(localStorage.getItem(REG_KEY) || '[]');
      list = list.filter(r => !(r.eventId == eventId && r.id == studentId));
      localStorage.setItem(REG_KEY, JSON.stringify(list));
      render();
    }

    render();
  </script>

</body>

</html>
