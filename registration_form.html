<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event Registration Form - SCE</title>
  <link rel="icon" href="assets/logo.png" type="image/x-icon">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background-color: #f5f7fa;
      margin: 0;
    }

    header {
      background-color: #5c75d4;
      color: white;
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    form {
      max-width: 500px;
      margin: 40px auto;
      background: white;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    }

    input,
    button {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    #eventName {
      background-color: #eee;
      font-weight: bold;
    }

    button {
      background-color: #5c75d4;
      color: white;
      border: none;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <header>
    <a href="register_events.html" style="color:white;font-weight:bold;font-size:1.8rem;">&larr;</a>
    <h1>Register for Event</h1>
    <img src="assets/SCE-LOGO.jpg" height="45">
  </header>

  <form id="registrationForm">
    <input type="text" id="studentName" placeholder="Student Name" required>
    <input type="text" id="studentId" placeholder="Student ID" required>
    <input type="text" id="course" placeholder="Course" required>
    <input type="text" id="eventName" readonly required>
    <button type="submit">Submit Registration</button>
  </form>

  <script>
    const EVENT_KEY = 'collegeEvents';
    const REG_KEY = 'registeredEvents';
    const selectedID = parseInt(localStorage.getItem('selectedEventId'));
    const events = JSON.parse(localStorage.getItem(EVENT_KEY) || '[]');
    const selectedEvent = events.find(e => e._id === selectedID);

    if (!selectedEvent) { alert("Error: Event not found. Return to events page."); document.getElementById("eventName").value = "Event not found"; }
    else { document.getElementById("eventName").value = `${selectedEvent.title} (${selectedEvent.type})`; }

    document.getElementById("registrationForm").addEventListener("submit", e => {
      e.preventDefault();
      if (!selectedEvent) { alert("Cannot register."); return; }
      const registration = {
        name: document.getElementById("studentName").value,
        id: document.getElementById("studentId").value,
        course: document.getElementById("course").value,
        eventId: selectedID,
        eventTitle: selectedEvent.title,
        eventType: selectedEvent.type,
        eventDate: selectedEvent.date,
        eventVenue: selectedEvent.venue,
        registrationDate: new Date().toISOString()
      };
      const existing = JSON.parse(localStorage.getItem(REG_KEY) || '[]');
      existing.push(registration);
      localStorage.setItem(REG_KEY, JSON.stringify(existing));
      alert("Registration successful!");
      window.location.href = 'registered_events.html';
    });
  </script>

</body>

</html>
