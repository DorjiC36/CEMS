<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Role - SCE Events</title>
    <link rel="icon" href="assets/logo.png" type="image/x-icon">
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            background-color: #f7f8fc;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .header {
            background-color: #4a5c9a;
            color: white;
            padding: 15px 30px;
            text-align: center;
            position: relative;
        }

        .back-arrow {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.5rem;
            color: white;
            text-decoration: none;
        }

        .role-container {
            max-width: 400px;
            margin: 80px auto;
            padding: 30px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
            flex-grow: 1;
        }

        h1,
        h2 {
            color: #4a5c9a;
            margin-bottom: 20px;
        }

        .role-button {
            display: block;
            width: 100%;
            padding: 15px;
            margin-bottom: 20px;
            border: none;
            border-radius: 4px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .role-button:hover {
            opacity: 0.9;
        }

        #admin-btn {
            background-color: #dc3545;
            color: white;
        }

        #user-btn {
            background-color: #28a745;
            color: white;
        }

        #code-prompt {
            margin-top: 20px;
            display: none;
        }

        #code-prompt input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            box-sizing: border-box;
            text-align: center;
        }

        #code-prompt button {
            background-color: #4a5c9a;
            color: white;
            padding: 10px 15px;
            border: none;
            cursor: pointer;
        }

        .footer {
            text-align: center;
            padding: 20px;
            background-color: #333;
            color: white;
        }

        .footer a {
            color: #ffb907;
            text-decoration: none;
            margin: 0 10px;
        }
    </style>
</head>

<body>
    <header class="header">
        <a href="index.html" class="back-arrow">&larr;</a>
        <h1>SCE Digital Notice Board</h1>
    </header>

    <main class="role-container">
        <h2>Select Your Role</h2>

        <button id="admin-btn" class="role-button">Admin Access</button>
        <button id="user-btn" class="role-button">View Events (User)</button>

        <div id="code-prompt">
            <p>**Enter your secret code to access the Admin Panel:**</p>
            <input type="password" id="secret-code" placeholder="Secret Code" required>
            <button id="submitCodeBtn">Submit</button>
        </div>
    </main>

    <footer class="footer">
        <div class="footer-links">
            <a href="about.html">About us</a>
            <a href="privacy.html">Privacy Policy</a>
            <span>Academic • Sports & Games • Cultural</span>
        </div>
        <p>© 2025 Samtse College of Education</p>
    </footer>

    <script>
        const ADMIN_CODE = "SCE2025admin";

        const adminBtn = document.getElementById('admin-btn');
        const userBtn = document.getElementById('user-btn');
        const codePrompt = document.getElementById('code-prompt');
        const submitCodeBtn = document.getElementById('submitCodeBtn');

        // Admin button shows the code prompt
        adminBtn.addEventListener('click', () => {
            codePrompt.style.display = 'block';
            document.getElementById('secret-code').focus();
        });

        // User button redirects to events page and sets user role
        userBtn.addEventListener('click', () => {
            const user = { username: 'guest', role: 'user' };
            localStorage.setItem('currentUser', JSON.stringify(user));
            window.location.href = 'main_menu.html';
        });

        // Check admin secret code
        function checkAdminCode() {
            const enteredCode = document.getElementById('secret-code').value.trim();
            if (enteredCode === ADMIN_CODE) {
                // Save admin info in localStorage
                const adminUser = { username: 'admin', role: 'admin' };
                localStorage.setItem('currentUser', JSON.stringify(adminUser));

                // Redirect to admin dashboard
                window.location.href = 'admin.html';
            } else {
                alert("Incorrect secret code. Access denied.");
                document.getElementById('secret-code').value = '';
                document.getElementById('secret-code').focus();
            }
        }

        submitCodeBtn.addEventListener('click', checkAdminCode);

        // Allow Enter key to submit
        document.getElementById('secret-code').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') checkAdminCode();
        });
    </script>
</body>

</html>
