<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upcoming Events - SCE</title>
  <link rel="icon" href="assets/logo.png" type="image/x-icon">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: #f5f7fa;
      margin: 0;
    }

    header {
      background: #5c75d4;
      color: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 15px 30px;
    }

    main {
      max-width: 900px;
      margin: 40px auto;
    }

    h2 {
      background: #5c75d4;
      color: white;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 20px;
    }

    .event-card {
      background: white;
      margin: 15px 0;
      padding: 20px;
      border-radius: 10px;
      border-left: 5px solid #5c75d4;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    }

    .event-card h3 {
      margin: 0 0 5px 0;
    }

    .event-card p {
      margin: 5px 0;
      color: #555;
    }

    .no-events {
      text-align: center;
      margin-top: 50px;
      color: #777;
      font-size: 1.2rem;
    }
  </style>
</head>

<body>

  <header>
    <a href="main_menu.html" style="color:white;font-weight:bold;font-size:1.8rem;">&larr;</a>
    <h1>Upcoming Events</h1>
    <img src="assets/SCE-LOGO.jpg" height="45">
  </header>

  <main>
    <h2>Don't Miss Out!</h2>
    <div id="eventsContainer"></div>
  </main>

  <script>
    const EVENT_KEY = 'collegeEvents';
    const container = document.getElementById('eventsContainer');

    function loadEvents() {
      let events = JSON.parse(localStorage.getItem(EVENT_KEY) || '[]');
      if (events.length === 0) { container.innerHTML = '<p class="no-events">No upcoming events at the moment.</p>'; return; }

      // Sort by date ascending
      events.sort((a, b) => new Date(a.date) - new Date(b.date));

      container.innerHTML = '';
      events.forEach(event => {
        const div = document.createElement('div');
        div.className = 'event-card';
        div.innerHTML = `
            <h3>${event.title} (${event.type})</h3>
            <p>📅 ${event.date} ${event.time ? 'at ' + event.time : ''}</p>
            <p>📍 ${event.venue}</p>
            <p>${event.description || ''}</p>
        `;
        container.appendChild(div);
      });
    }

    loadEvents();
  </script>

</body>

</html>
