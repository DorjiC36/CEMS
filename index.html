<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCE Digital Notice Board - Login</title>
    <link rel="icon" href="assets/logo.png" type="image/x-icon">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f7f8fc;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #4a5c9a;
            padding: 15px 30px;
            color: white;
        }

        .header-logo img {
            width: 60px;
            border-radius: 4px;
        }

        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
            padding: 20px;
        }

        .login-card {
            background: #f1f3fa;
            padding: 40px;
            border-radius: 8px;
            width: 400px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .login-card h2 {
            text-align: center;
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group input {
            width: 100%;
            padding: 10px;
            font-size: 1rem;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        .btn-primary {
            width: 100%;
            padding: 12px;
            background: #4a5c9a;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
        }

        .btn-primary:hover {
            background: #3a4c8a;
        }

        .signup-text {
            text-align: center;
            margin-top: 15px;
        }

        .signup-text a {
            color: #4a5c9a;
            font-weight: bold;
            text-decoration: none;
        }

        .signup-text a:hover {
            text-decoration: underline;
        }

        .footer {
            text-align: center;
            padding: 20px;
            background: #4a5c9a;
            color: white;
        }

        .footer-links {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }

        .footer-links a {
            color: #dcdcdc;
            text-decoration: none;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <header class="header">
        <h1>SCE Digital Notice Board</h1>
        <div class="header-logo"><img src="assets/SCE-LOGO.jpg" alt="SCE Logo"></div>
    </header>

    <main class="login-container">
        <div class="login-card">
            <h2>WELCOME</h2>
            <form id="login-form">
                <div class="input-group">
                    <input type="email" id="email" placeholder="name@sce.edu.bt" required>
                </div>
                <div class="input-group">
                    <input type="password" id="password" placeholder="********" required>
                </div>
                <button type="submit" class="btn-primary">Login</button>
            </form>
            <p class="signup-text">Not a Member yet? <a href="signup.html">Sign-up</a></p>
        </div>
    </main>

    <footer class="footer">
        <div class="footer-links">
            <a href="about.html">About us</a>
            <a href="privacy.html">Privacy Policy</a>
            <span>Academic • Sports & Games • Cultural</span>
        </div>
        <p>©2025 Samtse College of Education</p>
    </footer>

    <script>
        const loginForm = document.getElementById('login-form');
        loginForm.addEventListener('submit', function (e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            let users = JSON.parse(localStorage.getItem('sceUsers') || '[]');
            let user = users.find(u => u.email === email && u.password === password);
            if (user) {
                localStorage.setItem('currentUser', JSON.stringify(user));
                window.location.href = "select_role.html";
            } else {
                alert("Invalid credentials!");
            }
        });
    </script>
</body>

</html>
