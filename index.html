<!DOCTYPE html>
<html lang="en">

<head>
       
    <meta charset="UTF-8">
       
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>SCE Digital Notice Board - Login</title>
       
    <link rel="icon" href="assets/logo.png" type="image/x-icon">

        <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f7f8fc;
        }

        /* Header styling */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #4a5c9a;
            color: white;
            padding: 15px 30px;
        }

        .header-title {
            flex-grow: 1;
            text-align: center;
            font-size: 1.7rem;
            font-weight: bold;
        }

        .header-logo img {
            width: 60px;
            height: auto;
            border-radius: 4px;
        }

        /* Main login layout */
        .login-container {
            display: flex;
            justify-content: center;
            align-items: stretch;
            min-height: 80vh;
            background-color: white;
        }

        /* Left image section */
        .login-image {
            flex: 1;
        }

        .login-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 0;
        }

        /* Right login form section */
        .login-card {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 60px;
            background-color: #f1f3fa;
        }

        .login-card h2 {
            text-align: center;
            font-size: 2rem;
            color: #333;
            margin-bottom: 30px;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .input-group label {
            font-weight: bold;
            font-size: 1.1rem;
            margin-bottom: 5px;
        }

        .input-group input {
            padding: 10px;
            font-size: 1rem;
            width: 100%;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        .btn-primary {
            padding: 12px;
            font-size: 1rem;
            background-color: #4a5c9a;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .btn-primary:hover {
            background-color: #3a4c8a;
        }

        .signup-text {
            text-align: center;
            font-size: 1rem;
            margin-top: 15px;
        }

        .signup-text a {
            color: #4a5c9a;
            font-weight: bold;
            text-decoration: none;
        }

        .signup-text a:hover {
            text-decoration: underline;
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 20px;
            background-color: #4a5c9a;
            color: white;
        }

        .footer-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 10px;
        }

        .footer-links a {
            color: #dcdcdc;
            text-decoration: none;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }

        .contact-info p {
            margin: 5px 0;
            font-size: 0.9rem;
        }

        /* Responsive design */
        @media (max-width: 900px) {
            .login-container {
                flex-direction: column;
            }

            .login-image img {
                height: 250px;
            }

            .login-card {
                padding: 40px;
            }
        }
    </style>
</head>

<body>
     <header class="header">
         <h1 class="header-title">SCE Digital Notice Board</h1>
         <div class="header-logo">
           <img src="assets/SCE-LOGO.jpg" alt="Samtse College of Education Logo">
            </div>
         </header>

     <main class="login-container">
         <div class="login-image">
             <img src="assets/scehsll.jpg" alt="College event gathering">
             </div>
         <div class="login-card">
             <h2>WELCOME</h2>
            <form class="login-form">
               <div class="input-group">
                    <label for="email">E-mail Address</label>
                     <input type="email" id="email" name="email" placeholder="name@sce.edu.bt" required>
                     </div>
                 <div class="input-group">
                     <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="********" required>
                     </div>
                
                <button type="submit" class="btn-primary">Login</button>
                
            </form>
            
             <p class="signup-text">
                 Not a Member yet?
                 <a href="signup.html" class="btn-secondary">Sign-up</a>
                 </p>
            </div>
         </main>

     <footer class="footer">
        <div class="footer-links">
             <a href="about.html">About us</a>
             <a href="privacy.html">Privacy Policy</a>
             <span>Academic • Sports & Games • Cultural</span>
             </div>
         <p>©2025 Samtse College of Education</p>
         <div class="contact-info">
             <p>Contact us at: +975 77568876 | +975 17793887</p>
             <p>Email: cte@admin@sce.rub.edu.bt</p>
             </div>
         </footer>
    
    <script src="js/script.js"></script>
</body>

</html>
