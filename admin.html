<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - SCE Digital Notice Board</title>
    <link rel="icon" href="assets/logo.png" type="image/x-icon">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f7f8fc;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #4a5c9a;
            padding: 15px 30px;
            color: white;
        }

        .header-logo img {
            width: 60px;
            border-radius: 4px;
        }

        .admin-container {
            padding: 30px;
        }

        h2 {
            margin-bottom: 20px;
            color: #333;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 20px;
        }

        .btn-primary {
            background: #4a5c9a;
            color: white;
        }

        .btn-primary:hover {
            background: #3a4c8a;
        }

        .btn-logout {
            background: #e74c3c;
            color: white;
            float: right;
        }

        .btn-logout:hover {
            background: #c0392b;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        table,
        th,
        td {
            border: 1px solid #ccc;
        }

        th,
        td {
            padding: 10px;
            text-align: center;
        }

        th {
            background: #4a5c9a;
            color: white;
        }

        .footer {
            text-align: center;
            padding: 20px;
            background: #4a5c9a;
            color: white;
            margin-top: 40px;
        }

        .footer-links {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }

        .footer-links a {
            color: #dcdcdc;
            text-decoration: none;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }

        #notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #4a5c9a;
            color: white;
            padding: 15px 20px;
            border-radius: 6px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
            display: none;
            z-index: 9999;
        }
    </style>
</head>

<body>
    <header class="header">
        <h1>Admin Dashboard</h1>
        <div>
            <button class="btn btn-logout" id="logoutBtn">Logout</button>
            <div class="header-logo"><img src="assets/SCE-LOGO.jpg" alt="SCE Logo"></div>
        </div>
    </header>

    <main class="admin-container">
        <h2>Add New Event</h2>
        <div class="event-form">
            <div class="form-group">
                <input type="text" id="event-title" placeholder="Event Title" required>
            </div>
            <div class="form-group">
                <input type="date" id="event-date" required>
            </div>
            <div class="form-group">
                <input type="time" id="event-time">
            </div>
            <div class="form-group">
                <input type="text" id="event-venue" placeholder="Venue" required>
            </div>
            <div class="form-group">
                <select id="event-type" required>
                    <option value="">Select Event Type</option>
                    <option value="Academic">Academic</option>
                    <option value="Sports & Games">Sports & Games</option>
                    <option value="Cultural">Cultural</option>
                </select>
            </div>
            <div class="form-group">
                <textarea id="event-description" rows="3" placeholder="Event Description" required></textarea>
            </div>
            <button class="btn btn-primary" id="addEventBtn">Add Event</button>
        </div>

        <h2>All Events</h2>
        <table id="eventsTable">
            <thead>
                <tr>
                    <th>Title</th>
                    <th>Date</th>
                    <th>Time</th>
                    <th>Venue</th>
                    <th>Type</th>
                    <th>Description</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </main>

    <div id="notification"></div>

    <footer class="footer">
        <div class="footer-links">
            <a href="about.html">About us</a>
            <a href="privacy.html">Privacy Policy</a>
            <span>Academic • Sports & Games • Cultural</span>
        </div>
        <p>©2025 Samtse College of Education</p>
    </footer>

    <script>
        const currentUser = JSON.parse(localStorage.getItem('currentUser'));
        if (!currentUser || currentUser.role !== 'admin') {
            alert("Access denied. Admins only.");
            window.location.href = "index.html";
        }

        const eventsTable = document.getElementById('eventsTable').querySelector('tbody');
        const EVENT_KEY = 'collegeEvents';

        function showNotification(message, duration = 3000) {
            const notif = document.getElementById('notification');
            notif.textContent = message;
            notif.style.display = 'block';
            setTimeout(() => { notif.style.display = 'none'; }, duration);
        }

        function loadEvents() {
            let events = JSON.parse(localStorage.getItem(EVENT_KEY) || '[]');
            eventsTable.innerHTML = '';
            events.forEach((event, index) => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${event.title}</td>
                    <td>${event.date}</td>
                    <td>${event.time || '-'}</td>
                    <td>${event.venue}</td>
                    <td>${event.type}</td>
                    <td>${event.description}</td>
                    <td><button onclick="deleteEvent(${index})" class="btn" style="background:#e74c3c;color:white;border-radius:4px;">Delete</button></td>
                `;
                eventsTable.appendChild(row);
            });
        }

        function deleteEvent(index) {
            let events = JSON.parse(localStorage.getItem(EVENT_KEY) || '[]');
            events.splice(index, 1);
            localStorage.setItem(EVENT_KEY, JSON.stringify(events));
            loadEvents();
            showNotification("🗑️ Event deleted successfully!");
        }

        document.getElementById('addEventBtn').addEventListener('click', () => {
            const title = document.getElementById('event-title').value.trim();
            const date = document.getElementById('event-date').value;
            const time = document.getElementById('event-time').value;
            const venue = document.getElementById('event-venue').value.trim();
            const type = document.getElementById('event-type').value;
            const description = document.getElementById('event-description').value.trim();

            if (!title || !date || !venue || !type || !description) { showNotification("⚠️ Please fill all fields!"); return; }

            let events = JSON.parse(localStorage.getItem(EVENT_KEY) || '[]');
            const newEvent = { _id: Date.now(), title, date, time, venue, type, description };
            events.push(newEvent);
            localStorage.setItem(EVENT_KEY, JSON.stringify(events));

            document.getElementById('event-title').value = '';
            document.getElementById('event-date').value = '';
            document.getElementById('event-time').value = '';
            document.getElementById('event-venue').value = '';
            document.getElementById('event-type').value = '';
            document.getElementById('event-description').value = '';

            loadEvents();
            showNotification("✅ Event added successfully!");
        });

        document.getElementById('logoutBtn').addEventListener('click', () => {
            localStorage.removeItem('currentUser');
            window.location.href = 'select_role.html';
        });

        loadEvents();
    </script>
</body>

</html>
